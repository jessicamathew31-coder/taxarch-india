services:
  - type: web
    name: taxarch-india-api
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taxarch-db
          property: connectionString

databases:
  - name: taxarch-db
    plan: free
    region: singapore
